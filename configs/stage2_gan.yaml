# Stage 2: GAN fine-tune from the stage-1 EMA weights, ~25k iters (~3.5 h at ~2 it/s on RTX 5080).
_base_: stage1_psnr.yaml
run_dir: runs/stage2
train:
  total_iters: 25000
  lr: 1.0e-4
  scheduler: constant
  init_from: runs/stage1/ema.pt
gan:
  d_num_feat: 64
  d_lr: 1.0e-4
  perceptual_weight: 1.0
  gan_weight: 0.1
  vgg_pretrained: true
